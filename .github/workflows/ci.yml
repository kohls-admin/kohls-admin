name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ci-${{ github.ref }}-${{ startsWith(github.event.head_commit.message || github.event.pull_request.title, 'chore: release') && github.sha || '' }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message || github.event.pull_request.title, 'chore: release') }}"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, Coverage & Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Conventional Commits and version check
        uses: kohltastrophe/release@v1.0.0
        with:
          mode: check
          pr-title: ${{ github.event.pull_request.title }}

      - uses: kohltastrophe/sert/actions/setup@v0.1.0

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: Update llms.txt
        run: npx --yes luaudocs@latest llms

      - name: Commit llms.txt
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "docs: update llms.txt"
          file_pattern: "llms.txt"

      - name: sert run
        run: python3 tools/sert.py run --coverage

      # coverage and mutate write their own $GITHUB_STEP_SUMMARY
      - name: sert coverage
        run: python3 tools/sert.py coverage --min 90 --badge

      - name: sert mutate
        if: "!startsWith(github.event.head_commit.message || github.event.pull_request.title, 'chore: release')"
        run: python3 tools/sert.py mutate --no-coverage-run --min 85

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sert.py coverage --badge-branch --badge-push

  demo:
    name: Publish Demo Place
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
      - name: Publish demo place
        env:
          PLACE_PUBLISHING_KEY: ${{ secrets.PLACE_PUBLISHING_KEY }}
          TEST_UNIVERSE_ID: ${{ secrets.TEST_UNIVERSE_ID }}
          TEST_PLACE_ID: ${{ secrets.TEST_PLACE_ID }}
        run: |
          if [ -z "$PLACE_PUBLISHING_KEY" ] || [ -z "$TEST_UNIVERSE_ID" ] || [ -z "$TEST_PLACE_ID" ]; then
            echo "::notice::Demo place secrets not configured: publish skipped"
            exit 0
          fi
          rojo upload --api_key "$PLACE_PUBLISHING_KEY" --universe_id "$TEST_UNIVERSE_ID" --asset_id "$TEST_PLACE_ID" test
