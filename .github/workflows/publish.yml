name: Publish
on:
  push:
    branches:
      - main
    paths:
      - model/**
      - src/**
      - test/**
      - vendor/**
      - VERSION.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
      - name: Publish demo place
        run: |
          rokit --version
          rojo --version
          rojo upload --api_key "${{ secrets.PLACE_PUBLISHING_KEY }}" --universe_id ${{ secrets.TEST_UNIVERSE_ID }} --asset_id ${{ secrets.TEST_PLACE_ID }} test
