name: Lint & Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, Coverage & Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: kohltastrophe/sert/actions/setup@v0.1.0

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: sert run
        run: python3 tools/sert.py run --coverage

      # coverage and mutate write their own $GITHUB_STEP_SUMMARY
      - name: sert coverage
        run: python3 tools/sert.py coverage --min 90

      - name: sert mutate
        run: python3 tools/sert.py mutate --no-coverage-run --min 85
