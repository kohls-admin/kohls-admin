name: Lint & Test
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/lint.yml
      - .luaurc
      - model/**
      - rokit.toml
      - selene.toml
      - sert.toml
      - src/**
      - submodules/**
      - test/**
      - tools/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/lint.yml
      - .luaurc
      - model/**
      - rokit.toml
      - selene.toml
      - sert.toml
      - src/**
      - submodules/**
      - test/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, Coverage & Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: kohltastrophe/sert/actions/setup@master
        with:
          sert-ref: master

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: sert run
        run: python3 tools/sert.py run --coverage

      # coverage and mutate write their own $GITHUB_STEP_SUMMARY
      - name: sert coverage
        run: python3 tools/sert.py coverage --min 90

      - name: sert mutate
        run: python3 tools/sert.py mutate --no-coverage-run --min 85
