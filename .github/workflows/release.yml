# Release Kohl's Admin. kohltastrophe/release keeps a release PR open on main that bumps VERSION.txt and wally.toml;
# merging it tags v<version> and creates the GitHub release with Keep a Changelog release notes.
# When a release commit is merged (or workflow_dispatch is triggered), the remaining steps in the same job check the
# version, wait for CI on that commit, build MainModule.rbxm and KohlsAdmin.rbxm, attach them to the GitHub release,
# and publish them to Wally and the Roblox Creator Store.
#
#   push to main               kohltastrophe/release updates its PR, or releases when its PR was just merged
#   Run workflow on a v* tag   (dry_run off) publish that release again; every publish step is safe to repeat
#   Run workflow (dry_run on)  build and package only
#
# Secrets:
#   MY_RELEASE_PLEASE_TOKEN  a token that may push branches and open PRs, so the release PR runs CI
#   WALLY_AUTH_TOKEN         a Wally registry token for publishing kohltastrophe/kohls-admin
#   MODEL_TOKEN              an Open Cloud API key with Assets API read/write access for MAIN_MODULE_ASSET_ID & LOADER_ASSET_ID
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; no release assets or Roblox publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The MainModule every Loader requires by id, and the Creator Store model users insert (the Loader).
  MAIN_MODULE_ASSET_ID: 1868400649
  LOADER_ASSET_ID: 172732271

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1.0.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          wait-for-ci: ci.yml

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        with:
          version: v1.2.0

      - name: Build the release assets
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          rojo build .github/mainmodule.project.json --output dist/MainModule.rbxm
          rojo build .github/loader.project.json --output dist/KohlsAdmin.rbxm
          wally package --list
          wally package --output "$RUNNER_TEMP/wally.zip"
          size=$(stat -c %s "$RUNNER_TEMP/wally.zip")
          echo "Wally package: $size bytes (the registry refuses more than 2 MiB)"
          [ "$size" -le 2097152 ]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: release
          path: dist/
          if-no-files-found: error
          overwrite: true

      - name: Create or update the GitHub release
        if: steps.release.outputs.should_release == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          assets=(MainModule.rbxm KohlsAdmin.rbxm)
          if gh release view "$TAG" > /dev/null 2>&1; then
            git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --target "$GITHUB_SHA" --title "Kohl's Admin $VERSION" --notes-file "$NOTES_FILE"
            else
              gh release edit "$TAG" --target "$GITHUB_SHA" --title "Kohl's Admin $VERSION"
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            if [ "$PRERELEASE" = true ]; then
              gh release create "$TAG" "${assets[@]}" \
                --title "Kohl's Admin $VERSION" \
                --notes-file "$NOTES_FILE" \
                --prerelease
            else
              gh release create "$TAG" "${assets[@]}" \
                --title "Kohl's Admin $VERSION" \
                --notes-file "$NOTES_FILE"
            fi
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Kohl's Admin $VERSION" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Kohl's Admin $VERSION" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Publish kohltastrophe/kohls-admin to Wally
        if: steps.release.outputs.should_release == 'true'
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$WALLY_AUTH_TOKEN" ]; then echo "::notice::No WALLY_AUTH_TOKEN secret: Wally publish skipped"; exit 0; fi
          wally login --token "$WALLY_AUTH_TOKEN"
          # `wally publish` exits 0 even when the registry refuses the package, so read what it printed.
          output=$(wally publish 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          case "$output" in
            *"published successfully"*) ;;
            *"already exists"*) echo "::notice::kohltastrophe/kohls-admin@$VERSION was already on Wally" ;;
            *) echo "::error::Wally did not accept kohltastrophe/kohls-admin@$VERSION"; exit 1 ;;
          esac

      # Uploading a model again only adds an asset version, so a re-run is safe. The MainModule goes first: every
      # auto-updating game loads it on its next server.
      - name: Update the MainModule and the Loader
        if: steps.release.outputs.should_release == 'true'
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
        run: |
          if [ -z "$MODEL_TOKEN" ]; then echo "::notice::No MODEL_TOKEN secret: Roblox publish skipped"; exit 0; fi
          upload() {
            curl --fail-with-body -sS -X PATCH \
              "https://apis.roblox.com/assets/v1/assets/$1" \
              -H "x-api-key: $MODEL_TOKEN" \
              -F 'request={"assetId":"'"$1"'"};type=application/json' \
              -F "fileContent=@$2;type=model/x-rbxm"
            echo
          }
          upload "$MAIN_MODULE_ASSET_ID" dist/MainModule.rbxm
          upload "$LOADER_ASSET_ID" dist/KohlsAdmin.rbxm

  demo:
    name: Publish Demo Place
    needs: release
    if: needs.release.outputs.should_release == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
      - name: Publish demo place
        env:
          PLACE_PUBLISHING_KEY: ${{ secrets.PLACE_PUBLISHING_KEY }}
          TEST_UNIVERSE_ID: ${{ secrets.TEST_UNIVERSE_ID }}
          TEST_PLACE_ID: ${{ secrets.TEST_PLACE_ID }}
        run: |
          if [ -z "$PLACE_PUBLISHING_KEY" ] || [ -z "$TEST_UNIVERSE_ID" ] || [ -z "$TEST_PLACE_ID" ]; then
            echo "::notice::Demo place secrets not configured: publish skipped"
            exit 0
          fi
          rojo upload --api_key "$PLACE_PUBLISHING_KEY" --universe_id "$TEST_UNIVERSE_ID" --asset_id "$TEST_PLACE_ID" test
