name: Bug Report
description: Report a bug in Kohl's Admin
labels: ["bug"]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing Issues
      description: Search https://github.com/kohls-admin/kohls-admin/issues?q=is:issue+label:bug before opening a new report.
      options:
        - label: I searched open and closed bug reports.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did this happen on?
      options:
        - PC
        - Mobile
        - Console
        - VR
      default: 0

  - type: input
    id: ver
    attributes:
      label: Version
      description: Version shown in the dashboard status bar or by running `;version`.
      placeholder: 0.19.1

  - type: textarea
    id: desc
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the issue in Studio or a live server.

  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: |
        Attach relevant logs (`;logs`) or console output (`F9` / `/console` in chat).
