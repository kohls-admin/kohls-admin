name: Feature Request
description: Suggest an improvement or new feature for Kohl's Admin
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Existing Requests
      description: Search https://github.com/kohls-admin/kohls-admin/issues?q=is:issue+label:enhancement before opening a new request.
      options:
        - label: I searched open and closed feature requests.
          required: true

  - type: textarea
    id: desc
    attributes:
      label: Description
      description: What would you like added or changed, and what problem does it solve?
    validations:
      required: true
